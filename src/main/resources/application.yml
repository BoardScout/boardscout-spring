spring:
  application:
    name: boardgame-core
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  session:
    cookie-name: ${SESSION_COOKIE_NAME:BGSESSION}
    ttl: ${SESSION_TTL:30m}

